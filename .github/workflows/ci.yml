name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 契约仓库与本仓库并列存放（package.json 使用 file:../erp-contracts）
      # erp-contracts 为私有仓库时需配置 secrets.CONTRACTS_TOKEN；公开则匿名 clone
      - name: Clone contracts
        env:
          CONTRACTS_TOKEN: ${{ secrets.CONTRACTS_TOKEN }}
        run: |
          if [ -n "$CONTRACTS_TOKEN" ]; then
            git clone --depth 1 "https://x-access-token:${CONTRACTS_TOKEN}@github.com/toyako/erp-contracts.git" ../erp-contracts
          else
            git clone --depth 1 https://github.com/toyako/erp-contracts.git ../erp-contracts
          fi

      - run: pnpm install

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      - name: 全链路 HTTP 冒烟
        run: node scripts/smoke-api.cjs
