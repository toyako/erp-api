services:
  - type: web
    name: erp-api
    runtime: node
    plan: free
    region: singapore
    # 1) 契约仓库并列 clone 到 ../erp-contracts（package.json 用 file:../erp-contracts）
    # 2) NODE_ENV=production 下 pnpm 会跳过 devDeps，而 prisma/typescript 都在 devDeps
    buildCommand: rm -rf ../erp-contracts && git clone --depth 1 https://github.com/toyako/erp-contracts.git ../erp-contracts && pnpm install --prod=false && pnpm exec prisma generate && pnpm build
    # 一次性：启动时先清库重跑种子（2026-11-16 演示数据重建；Render 免费版无 Shell，
    # 只能借启动命令跑一次）。验证通过后立即改回正常启动命令。
    # 注意：reset 失败会直接拦住本次部署（&&），旧版继续服务，不会带半清的库上线。
    startCommand: sh -c "DEMO_RESET_CONFIRMED=1 pnpm exec tsx prisma/reset-demo.ts && pnpm exec prisma migrate deploy && node dist/main.js"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # 使用 Prisma 适配器，数据落到 Supabase PostgreSQL
      - key: ERP_DB_ADAPTER
        value: prisma
      # 在 Render 面板填入 Supabase 直连串（端口 5432，非 pgbouncer）
      - key: DATABASE_URL
        sync: false
      # 首次部署自动生成，禁止在仓库中出现真实值
      - key: JWT_SECRET
        generateValue: true
